<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小鱼云群控</title><link rel="icon" href="/brand-icon.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/redesign.css"><link rel="stylesheet" href="/login-redesign.css"><script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')</script></head>
<body class="login-page"><button class="login-theme" id="themeButton" title="切换昼夜主题">◐</button><form class="login-card" id="login"><div class="login-brand"><img src="/brand-icon.png" alt=""><span>Cloud Control</span></div><h1>欢迎回来</h1><p class="login-subtitle">登录小鱼云群控管理平台</p><label>用户名<input name="username" autocomplete="username" placeholder="请输入用户名" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label><p class="error" id="error"></p><button>登录控制台</button></form><script>themeButton.onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.setItem('theme',theme)};login.onsubmit=async e=>{e.preventDefault();error.textContent="";const data=Object.fromEntries(new FormData(login));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(r.ok) location.href='/';else error.textContent=body.error}</script></body></html>
