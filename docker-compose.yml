services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cloudeqk}
      MYSQL_USER: ${DB_USER:-cloudeqk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build: .
    restart: unless-stopped
    environment:
      PORT: 6001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cloudeqk}
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-cloudeqk}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
    ports:
      - "${APP_PORT:-6001}:6001"
    volumes:
      - server_data:/app/server/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  server_data:
