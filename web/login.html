<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小鱼云群控</title><link rel="icon" href="/brand-icon.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head>
<body class="login-page"><form class="login-card" id="login"><img src="/brand-icon.png" alt=""><h1>登录小鱼云群控</h1><label>用户名<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><p class="error" id="error"></p><button>登录</button></form><script>login.onsubmit=async e=>{e.preventDefault();error.textContent="";const data=Object.fromEntries(new FormData(login));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(r.ok) location.href='/';else error.textContent=body.error}</script></body></html>
